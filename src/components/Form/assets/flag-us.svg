<svg width="16" height="12" viewBox="0 0 16 12" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
  <!--
    Flattened from the Figma "flags-en-US" node (KihJKyGA20stc2SSjAlxYU, 15153:6136).
    The source is composed of 13 stacked 1px stripe rects (fills #E03232 / #FFFFFF) plus a
    canton block (#66A1CC under #0035A0) rather than a single raster/path asset, so the
    layers are reproduced here at their exact source coordinates instead of re-drawing the flag.
  -->
  <rect width="16" height="12" fill="#C0CFD8" />
  <rect x="0.5" y="0.5" width="15" height="1" fill="#E03232" />
  <rect x="0.5" y="1.5" width="15" height="1" fill="#FFFFFF" />
  <rect x="0.5" y="2.5" width="15" height="1" fill="#E03232" />
  <rect x="0.5" y="3.5" width="15" height="1" fill="#FFFFFF" />
  <rect x="0.5" y="4.5" width="15" height="1" fill="#E03232" />
  <rect x="0.5" y="5.5" width="15" height="1" fill="#FFFFFF" />
  <rect x="0.5" y="6.5" width="15" height="1" fill="#E03232" />
  <rect x="0.5" y="7.5" width="15" height="1" fill="#FFFFFF" />
  <rect x="0.5" y="8.5" width="15" height="1" fill="#E03232" />
  <rect x="0.5" y="9.5" width="15" height="1" fill="#FFFFFF" />
  <rect x="0.5" y="10.5" width="15" height="1" fill="#E03232" />
  <rect x="0.5" y="0.5" width="8" height="6" fill="#66A1CC" />
  <rect x="0.5" y="0.5" width="8" height="6" fill="#0035A0" />
</svg>
